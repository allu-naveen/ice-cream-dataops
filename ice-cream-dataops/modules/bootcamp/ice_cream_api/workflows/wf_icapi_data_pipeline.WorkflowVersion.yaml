workflowExternalId: wf_icapi_data_pipeline
version: '1'
workflowDefinition:
  description: 'Run the Ice Cream API pipeline in sequence'
  tasks:
    - externalId: create_asset_hierarchy_task
      type: transformation
      parameters:
        transformation:
          externalId: create_asset_hierarchy
          concurrencyPolicy: fail
      name: Create asset hierarchy
      description: Create the Cognite asset hierarchy from factory assets
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow
    
    - externalId: contextualize_ts_assets_task
      type: transformation
      parameters:
        transformation:
          externalId: contextualize_ts_assets
          concurrencyPolicy: fail
      name: Contextualize time series
      description: Link extracted time series to Cognite assets
      retries: 3
      timeout: 3600
      onFailure: skipTask
      dependsOn:
        - externalId: create_asset_hierarchy_task
    
       
    - externalId: icapi_datapoints_extractor_task
      type: function
      parameters:
        function:
          externalId: icapi_datapoints_extractor
          data: { "hours": 1 }
        isAsyncComplete: false
      name: Extract ICAPI datapoints
      description: Extract datapoints from the Ice Cream Factory API
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow
      dependsOn:
        - externalId: contextualize_ts_assets_task

    - externalId: oee_timeseries_task
      type: function
      parameters:
        function:
          externalId: oee_timeseries
          data: {}
        isAsyncComplete: false
      name: Calculate OEE time series
      description: Calculate OEE time series from contextualized data
      retries: 3
      timeout: 3600
      onFailure: abortWorkflow
      dependsOn:
        - externalId: icapi_datapoints_extractor_task